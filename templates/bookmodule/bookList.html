{% extends "layouts/base.html" %}

{% block content %}
  <h2>Book List</h2>
  {% if books %}
    <ul>
      {% for book in books %}
        <li>
          <strong>Title:</strong> {{ book.title }}<br>
          <strong>Author:</strong> {{ book.author }}<br>
          <strong>ID:</strong> {{ book.id }}
        </li>
        <hr>
      {% endfor %}
    </ul>
  {% else %}
    <p>No books found matching your search.</p>
  {% endif %}
{% endblock %}
